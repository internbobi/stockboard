<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTCKVN</title>
<style>
  * { box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; display: flex; }
  .board { width: 33.33%; min-height: 100vh; container-type: inline-size; padding: 1.5cqw 1.2cqw; display: flex; flex-direction: column; }
  h1 { text-align: center; font-size: 2.6cqw; margin: 0.8cqw 0 1.4cqw; line-height: 1.2; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(17, 1fr); gap: 0.9cqw; flex: 1; }
  .cell { border: 1px solid #fff; border-radius: 0.9cqw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1cqw; padding: 0.3cqw 0.5cqw; text-align: center; line-height: 1.1; overflow: hidden; min-height: 0; }
  .cell.up { background: #00FF22; color: #000; }
  .cell.down { background: #C40000; color: #fff; }
  .cell.flat { background: #FFCC00; color: #000; }
  .sym { font-weight: bold; font-size: 2cqw; }
  .price { font-size: 1.9cqw; }
  .val { font-size: 1.9cqw; }
  .foot { text-align: center; color: #888; font-size: 1.05cqw; margin-top: 1.6cqw; line-height: 1.5; }
  #countdown { position: fixed; right: 14px; bottom: 12px; background: rgba(255,255,255,0.14); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; z-index: 10; }
  #status { text-align: center; color: #bbb; font-size: 1.1cqw; }
  .market { width: 33.33%; min-height: 100vh; container-type: inline-size; padding: 1.5cqw 1.2cqw; }
  .market canvas { width: 100%; height: 320px; display: block; background: #000; }
  .vninfo { text-align: center; color: #bbb; font-size: 1.6cqw; margin: 0.5cqw 0 1cqw; line-height: 1.5; }
  /* % layers (Tang 2, 3, 4, 5) all share the same height, so the panel still
     fits Layers 4 & 5 below. Layer 1 stays taller as the main chart.
     NOTE: the selector must beat ".market canvas" (0,1,1), so it is written
     as ".market canvas.pct-chart" (0,2,1) — a bare ".pct-chart" (0,1,0)
     loses and the % layers silently stay 320px (caught 2026-11-11). */
  .market canvas.pct-chart { height: 120px; }
</style>
</head>
<body>
<div class="board">
<h1 id="title">TTCKVN</h1>
<div class="grid" id="grid"></div>
<p id="status">Đang tải dữ liệu…</p>
<p class="foot">Đây chỉ là bảng hiển thị dữ liệu, không phải khuyến nghị đầu tư.</p>
</div>
<div class="market">
<h1>Trạng thái TTCKVN</h1>
<div id="vninfo" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="vnchart"></canvas>
<div id="ema50info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="ema50chart" class="pct-chart"></canvas>
<div id="ema200info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="ema200chart" class="pct-chart"></canvas>
<div id="tma4info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="tma4chart" class="pct-chart"></canvas>
<div id="tma5info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="tma5chart" class="pct-chart"></canvas>
</div>
<div id="countdown"></div>
<script>
function fmtDate(iso) {
  const p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function fmtPricePct(close, pct) {
  return close.toFixed(2) + ' (' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%)';
}
function renderBoard(data) {
  document.getElementById('title').textContent = 'TTCKVN Ngày ' + fmtDate(data.date);
  document.getElementById('status').textContent = '';
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  data.items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'cell ' + (it.change > 0 ? 'up' : (it.change < 0 ? 'down' : 'flat'));
    d.innerHTML = '<div class="sym">' + it.symbol + '</div>'
      + '<div class="price">' + fmtPricePct(it.close, it.pct) + '</div>'
      + '<div class="val">' + it.value_billion.toFixed(2) + ' tỷ</div>';
    grid.appendChild(d);
  });
}
function loadData() {
  fetch('data.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được data.json');
    return r.json();
  }).then(renderBoard).catch(e => {
    document.getElementById('status').textContent = 'Chưa có dữ liệu: ' + e.message;
  });
}
loadData();
setInterval(loadData, 30000);
function nextRefreshDate(now) {
  const day = now.getDay();
  if (day === 0 || day === 6) return null;
  const mins = now.getHours() * 60 + now.getMinutes();
  const start = 8 * 60 + 45, end = 15 * 60;
  if (mins < start) {
    const d = new Date(now); d.setHours(8, 45, 0, 0); return d;
  }
  if (mins >= end) return null;
  const next = new Date(now);
  next.setSeconds(0, 0);
  next.setMinutes(next.getMinutes() + (5 - (next.getMinutes() % 5)));
  if (next.getHours() * 60 + next.getMinutes() > end) return null;
  return next;
}
function tickCountdown() {
  const el = document.getElementById('countdown');
  const target = nextRefreshDate(new Date());
  if (!target) {
    el.textContent = 'Đã hết phiên giao dịch — cập nhật tiếp theo lúc 8:45';
    return;
  }
  const diff = Math.max(0, target - new Date());
  const x = Math.floor(diff / 60000);
  const y = Math.floor((diff % 60000) / 1000);
  el.textContent = 'Cập nhật tiếp theo trong ' + x + ' phút ' + y + ' giây';
}
tickCountdown();
setInterval(tickCountdown, 1000);
</script>
<script>
// ---- Feature 2: VNINDEX chart (last 1 year, daily bars) ----
let vnData = null;
const VN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Empty space after the last session (Dat, 2026-11-12): ~15 bars of breathing
// room on the right of every Block 2 chart, so the last bar is not jammed
// against the right edge and the value labels sit clear of the data.
const PAD_BARS = 15;
function fmtNum(x, dec) {
  return x.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}
function drawVNChart() {
  if (!vnData) return;
  const cv = document.getElementById('vnchart');
  const cssW = cv.clientWidth, cssH = cv.clientHeight;
  if (!cssW || !cssH) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssW, cssH);
  const items = vnData.items, n = items.length;
  const L = 6, R = 62, T = 8, B = 26;
  const plotW = cssW - L - R, plotH = cssH - T - B;
  let mn = Infinity, mx = -Infinity;
  items.forEach(it => {
    mn = Math.min(mn, it.low, it.ma10, it.ma50, it.ma150, it.ma200);
    mx = Math.max(mx, it.high, it.ma10, it.ma50, it.ma150, it.ma200);
  });
  const pad = (mx - mn) * 0.03;
  mn -= pad; mx += pad;
  const X = i => L + (i + 0.5) * plotW / (n + PAD_BARS);
  const Y = p => T + (mx - p) / (mx - mn) * plotH;
  const range = mx - mn;
  const step = range > 400 ? 100 : range > 200 ? 50 : range > 100 ? 25 : 10;
  ctx.font = '11px Arial';
  ctx.textBaseline = 'middle';
  for (let p = Math.ceil(mn / step) * step; p <= mx; p += step) {
    const y = Y(p);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(cssW - R, y); ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'left';
    ctx.fillText(fmtNum(p, 0), cssW - R + 6, y);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i < n; i++) {
    const d = items[i].date;
    const m = parseInt(d.slice(5, 7), 10);
    const prevM = i > 0 ? parseInt(items[i - 1].date.slice(5, 7), 10) : null;
    if (m !== prevM) {
      const x = X(i);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + plotH); ctx.stroke();
      ctx.fillStyle = '#aaa';
      const label = (m === 1) ? d.slice(0, 4) : VN_MONTHS[m - 1];
      const lx = Math.max(14, Math.min(cssW - R - 14, x));
      ctx.fillText(label, lx, T + plotH + 6);
    }
  }
  // SMA lines, SMA only on this chart (Dat, 2026-11-11).
  // Colors: MA50 green, MA150 yellow, MA200 red.
  const mas = [['ma200', '#C40000'], ['ma150', '#FFCC00'], ['ma50', '#00FF22']];
  mas.forEach(([key, col]) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    items.forEach((it, i) => {
      const v = it[key];
      if (v == null) return;
      if (!started) { ctx.moveTo(X(i), Y(v)); started = true; }
      else ctx.lineTo(X(i), Y(v));
    });
    ctx.stroke();
  });
  // MA10: color changes along the line per Dat's AFL logic, applied to SMA10
  // (C > SMA10: pale green #98FB98, C < SMA10: red #FF0000, C == SMA10: yellow #FFFF00)
  ctx.lineWidth = 1.5;
  for (let i = 1; i < n; i++) {
    const a = items[i - 1], b = items[i];
    if (a.ma10 == null || b.ma10 == null) continue;
    ctx.strokeStyle = a.ma10_color;
    ctx.beginPath();
    ctx.moveTo(X(i - 1), Y(a.ma10));
    ctx.lineTo(X(i), Y(b.ma10));
    ctx.stroke();
  }
  const bw = Math.max(1, plotW / (n + PAD_BARS) * 0.6);
  items.forEach((it, i) => {
    const x = X(i);
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, Y(it.high));
    ctx.lineTo(x, Y(it.low));
    ctx.moveTo(x - bw / 2, Y(it.close));
    ctx.lineTo(x + bw / 2, Y(it.close));
    ctx.stroke();
  });
  // Value labels on the right price axis: VN Index (white bg) + 4 MA values
  // (bg = line color), black bold text. May overlap the axis tick marks.
  const last = items[n - 1];
  const vlabels = [
    { v: last.close, bg: '#FFFFFF' },
    { v: last.ma10, bg: last.ma10_color },
    { v: last.ma50, bg: '#00FF22' },
    { v: last.ma150, bg: '#FFCC00' },
    { v: last.ma200, bg: '#C40000' },
  ].filter(l => l.v != null);
  const LH = 15;
  const GAP = LH + 2; // 2px gap: labels never touch or overlap, all stay visible;
  // sorted by value top-to-bottom (larger value on top), pushed down only as needed
  const ys = vlabels.map(l => Y(l.v)).sort((a, b) => a - b);
  for (let i = 1; i < ys.length; i++) {
    if (ys[i] - ys[i - 1] < GAP) ys[i] = ys[i - 1] + GAP;
  }
  if (ys.length && ys[ys.length - 1] + LH / 2 > T + plotH) {
    const shift = ys[ys.length - 1] + LH / 2 - (T + plotH);
    for (let i = 0; i < ys.length; i++) ys[i] -= shift;
  }
  if (ys.length && ys[0] - LH / 2 < T) {
    const shift = T - (ys[0] - LH / 2);
    for (let i = 0; i < ys.length; i++) ys[i] += shift;
  }
  const sorted = vlabels.slice().sort((a, b) => b.v - a.v);
  ctx.font = 'bold 10px Arial';
  ctx.textBaseline = 'middle';
  sorted.forEach((l, i) => {
    const y = ys[i];
    const txt = fmtNum(l.v, 2);
    const w = Math.min(R - 4, ctx.measureText(txt).width + 8);
    const x0 = cssW - R + 2;
    ctx.fillStyle = l.bg;
    ctx.fillRect(x0, y - LH / 2, w, LH);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.fillText(txt, x0 + w / 2, y + 0.5);
  });
}
function loadVNChart() {
  fetch('vnindex.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được vnindex.json');
    return r.json();
  }).then(data => {
    vnData = data;
    const l = data.latest;
    document.getElementById('vninfo').innerHTML =
      'VNINDEX ' + l.date.split('-').reverse().join('/') +
      ' &nbsp;|&nbsp; Open ' + fmtNum(l.open, 2) +
      ', High ' + fmtNum(l.high, 2) +
      ', Low ' + fmtNum(l.low, 2) +
      ', Close ' + fmtNum(l.close, 2) +
      ' (' + (l.change_pct > 0 ? '+' : '') + l.change_pct.toFixed(2) + '%)';
    drawVNChart();
  }).catch(e => {
    document.getElementById('vninfo').textContent = 'Chưa có dữ liệu: ' + e.message;
  });
}
loadVNChart();
let vnResizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(vnResizeT);
  vnResizeT = setTimeout(() => {
    drawVNChart();
    if (typeof pctLayers !== 'undefined') {
      Object.keys(pctLayers).forEach(id => {
        drawPctChart(document.getElementById(id), pctLayers[id]);
      });
    }
    if (typeof tma5Data !== 'undefined' && tma5Data) {
      drawTMA5Chart(document.getElementById('tma5chart'), tma5Data);
    }
  }, 150);
});
</script>
<script>
// ---- Feature 2, Layers 2-5: % of stocks above/below an EMA (line + dots) ----
// One generic drawer/loader for all % layers: Layer 2 = EMA50
// (MidStrong/MidWeak), Layer 3 = EMA200 (LongStrong/LongWeak), ...
// All % layers share the time axis with Layer 1 (L=6, R=62, same dates, 1 year)
// and the same height (.pct-chart, 120px).
const pctLayers = {}; // canvasId -> data (redrawn on resize)
function drawArrow(ctx, x, y, up, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  if (up) {
    ctx.moveTo(x, y - 4);
    ctx.lineTo(x - 4, y + 3);
    ctx.lineTo(x + 4, y + 3);
  } else {
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x - 4, y - 3);
    ctx.lineTo(x + 4, y - 3);
  }
  ctx.closePath();
  ctx.fill();
}
function drawPctChart(cv, data) {
  if (!cv || !data) return;
  const cssW = cv.clientWidth, cssH = cv.clientHeight;
  if (!cssW || !cssH) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssW, cssH);
  const items = data.items, n = items.length;
  // Same time axis as Layer 1: L=6, R=62, same dates (1 year, 2025-11-11..2026-11-11),
  // so every date sits at the exact same x in both layers.
  const L = 6, R = 62, T = 8, B = 26;
  const plotW = cssW - L - R, plotH = cssH - T - B;
  const Y = p => T + (100 - p) / 100 * plotH;
  const X = i => L + (i + 0.5) * plotW / (n + PAD_BARS);
  ctx.font = '11px Arial';
  ctx.textBaseline = 'middle';
  for (let p = 0; p <= 100; p += 20) {
    const y = Y(p);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(cssW - R, y); ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'left';
    ctx.fillText(String(p), cssW - R + 6, y);
  }
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(L, Y(50)); ctx.lineTo(cssW - R, Y(50)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i < n; i++) {
    const d = items[i].date;
    const m = parseInt(d.slice(5, 7), 10);
    const prevM = i > 0 ? parseInt(items[i - 1].date.slice(5, 7), 10) : null;
    if (m !== prevM) {
      const x = X(i);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + plotH); ctx.stroke();
      ctx.fillStyle = '#aaa';
      const label = (m === 1) ? d.slice(0, 4) : VN_MONTHS[m - 1];
      const lx = Math.max(14, Math.min(cssW - R - 14, x));
      ctx.fillText(label, lx, T + plotH + 6);
    }
  }
  // Lines through the points (above green, below red), dots on top.
  const series = [['pct_above', '#00FF22'], ['pct_below', '#C40000']];
  series.forEach(([key, col]) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    items.forEach((it, i) => {
      if (i === 0) ctx.moveTo(X(i), Y(it[key]));
      else ctx.lineTo(X(i), Y(it[key]));
    });
    ctx.stroke();
  });
  items.forEach((it, i) => {
    const x = X(i);
    ctx.fillStyle = '#00FF22';
    ctx.beginPath(); ctx.arc(x, Y(it.pct_above), 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#C40000';
    ctx.beginPath(); ctx.arc(x, Y(it.pct_below), 2, 0, Math.PI * 2); ctx.fill();
  });
  items.forEach((it, i) => {
    if (i === 0) return;
    const prev = items[i - 1].pct_above, cur = it.pct_above;
    const x = X(i), y = Y(cur);
    if (prev < 50 && cur >= 50) drawArrow(ctx, x, y + 10, true, '#00FF22');
    else if (prev > 50 && cur <= 50) drawArrow(ctx, x, y - 10, false, '#C40000');
  });
  // Value labels on the right value axis: above (green bg) + below (red bg),
  // black bold text. Same rules as Layer 1: bg = line color, sorted by value
  // (larger on top), never overlap.
  const last = items[n - 1];
  const vlabels = [
    { v: last.pct_above, bg: '#00FF22' },
    { v: last.pct_below, bg: '#C40000' },
  ].filter(l => l.v != null);
  const LH = 15;
  const GAP = LH + 2;
  const ys = vlabels.map(l => Y(l.v)).sort((a, b) => a - b);
  for (let i = 1; i < ys.length; i++) {
    if (ys[i] - ys[i - 1] < GAP) ys[i] = ys[i - 1] + GAP;
  }
  if (ys.length && ys[ys.length - 1] + LH / 2 > T + plotH) {
    const shift = ys[ys.length - 1] + LH / 2 - (T + plotH);
    for (let i = 0; i < ys.length; i++) ys[i] -= shift;
  }
  if (ys.length && ys[0] - LH / 2 < T) {
    const shift = T - (ys[0] - LH / 2);
    for (let i = 0; i < ys.length; i++) ys[i] += shift;
  }
  const sorted = vlabels.slice().sort((a, b) => b.v - a.v);
  ctx.font = 'bold 10px Arial';
  ctx.textBaseline = 'middle';
  sorted.forEach((l, i) => {
    const y = ys[i];
    const txt = l.v.toFixed(2) + '%';
    const w = Math.min(R - 4, ctx.measureText(txt).width + 8);
    const x0 = cssW - R + 2;
    ctx.fillStyle = l.bg;
    ctx.fillRect(x0, y - LH / 2, w, LH);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.fillText(txt, x0 + w / 2, y + 0.5);
  });
}
function loadPctChart(file, infoId, canvasId, strongName, weakName) {
  fetch(file + '?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được ' + file);
    return r.json();
  }).then(data => {
    pctLayers[canvasId] = data;
    const l = data.latest;
    document.getElementById(infoId).innerHTML =
      strongName + ': <span style="color:#00FF22">' + l.pct_above.toFixed(2) + '%</span>' +
      ' &nbsp;|&nbsp; ' + weakName + ': <span style="color:#C40000">' + l.pct_below.toFixed(2) + '%</span>';
    drawPctChart(document.getElementById(canvasId), data);
  }).catch(e => {
    document.getElementById(infoId).textContent = 'Chưa có dữ liệu: ' + e.message;
  });
}
loadPctChart('pct_ema50.json', 'ema50info', 'ema50chart', 'MidStrong', 'MidWeak');
loadPctChart('pct_ema200.json', 'ema200info', 'ema200chart', 'LongStrong', 'LongWeak');
</script>
<script>
// ---- Feature 2, Layers 4 & 5: TMA 6-phase counts (shared foundation) ----
// One fetch (tma_counts.json) feeds both layers. Layer 4 reuses drawPctChart
// (PctVT/PctVG as pct_above/pct_below). Layer 5 draws the V3T/V3G counts.
// Colors (Dat's AFL colorCustom12 / colorCustom11): V3T magenta #FF00FF,
// V3G cyan #00FFFF; 3-month new-high circles bright green #00FF22.
let tma5Data = null;
function drawTMA5Chart(cv, data) {
  if (!cv || !data) return;
  const cssW = cv.clientWidth, cssH = cv.clientHeight;
  if (!cssW || !cssH) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssW, cssH);
  const all = data.items, nAll = all.length;
  const startIdx = all.findIndex(it => it.date >= data.from);
  const show = startIdx >= 0 ? all.slice(startIdx) : all;
  const n = show.length;
  // Rolling HHV(260) / HHV(65) of the V3 counts over the FULL history
  // (not just the display window).
  const hhv260t = [], hhv260g = [], hhv65t = [], hhv65g = [];
  for (let i = 0; i < nAll; i++) {
    const w260 = all.slice(Math.max(0, i - 259), i + 1);
    const w65 = all.slice(Math.max(0, i - 64), i + 1);
    hhv260t.push(Math.max.apply(null, w260.map(it => it.v3t)));
    hhv260g.push(Math.max.apply(null, w260.map(it => it.v3g)));
    hhv65t.push(Math.max.apply(null, w65.map(it => it.v3t)));
    hhv65g.push(Math.max.apply(null, w65.map(it => it.v3g)));
  }
  // y range: max HHV over the display window, rounded up to a multiple of 50.
  let ymax = 50;
  for (let i = startIdx; i < nAll; i++) {
    ymax = Math.max(ymax, hhv260t[i], hhv260g[i], all[i].v3t, all[i].v3g);
  }
  ymax = Math.ceil(ymax / 50) * 50;
  const L = 6, R = 62, T = 8, B = 26;
  const plotW = cssW - L - R, plotH = cssH - T - B;
  const Y = v => T + (ymax - v) / ymax * plotH;
  const X = i => L + (i + 0.5) * plotW / (n + PAD_BARS);
  ctx.font = '11px Arial';
  ctx.textBaseline = 'middle';
  for (let v = 0; v <= ymax; v += 50) {
    const y = Y(v);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(cssW - R, y); ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'left';
    ctx.fillText(String(v), cssW - R + 6, y);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i < n; i++) {
    const d = show[i].date;
    const m = parseInt(d.slice(5, 7), 10);
    const prevM = i > 0 ? parseInt(show[i - 1].date.slice(5, 7), 10) : null;
    if (m !== prevM) {
      const x = X(i);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + plotH); ctx.stroke();
      ctx.fillStyle = '#aaa';
      const label = (m === 1) ? d.slice(0, 4) : VN_MONTHS[m - 1];
      const lx = Math.max(14, Math.min(cssW - R - 14, x));
      ctx.fillText(label, lx, T + plotH + 6);
    }
  }
  // 52-week-high dashed lines (magenta V3T, cyan V3G).
  const hhvLines = [[hhv260t, '#FF00FF'], [hhv260g, '#00FFFF']];
  hhvLines.forEach(([arr, col]) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const y = Y(arr[startIdx + i]);
      if (i === 0) ctx.moveTo(X(i), y);
      else ctx.lineTo(X(i), y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });
  // V3T / V3G count lines (magenta / cyan), no dots (AFL styleLine).
  const countLines = [['v3t', '#FF00FF'], ['v3g', '#00FFFF']];
  countLines.forEach(([key, col]) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    show.forEach((it, i) => {
      if (i === 0) ctx.moveTo(X(i), Y(it[key]));
      else ctx.lineTo(X(i), Y(it[key]));
    });
    ctx.stroke();
  });
  // New-high circles + lead markers at the bottom (y = 2).
  show.forEach((it, i) => {
    const fi = startIdx + i;
    const x = X(i);
    // V3T: 52-week high (magenta, +10) / 3-month high (bright green, +5).
    if (it.v3t >= hhv260t[fi]) {
      ctx.fillStyle = '#FF00FF';
      ctx.beginPath(); ctx.arc(x, Y(it.v3t) - 10, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    if (it.v3t >= hhv65t[fi]) {
      ctx.fillStyle = '#00FF22';
      ctx.beginPath(); ctx.arc(x, Y(it.v3t) - 5, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    // V3G: 52-week high (magenta, +10) / 3-month high (bright green, +5).
    if (it.v3g >= hhv260g[fi]) {
      ctx.fillStyle = '#FF00FF';
      ctx.beginPath(); ctx.arc(x, Y(it.v3g) - 10, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    if (it.v3g >= hhv65g[fi]) {
      ctx.fillStyle = '#00FF22';
      ctx.beginPath(); ctx.arc(x, Y(it.v3g) - 5, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    // Lead: the phase with the largest count of all 6 phases.
    const counts = [it.v1t, it.v2t, it.v3t, it.v1g, it.v2g, it.v3g];
    if (it.v3t > Math.max(it.v1t, it.v2t, it.v1g, it.v2g, it.v3g)) {
      ctx.fillStyle = '#FF00FF';
      ctx.beginPath(); ctx.arc(x, Y(2), 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (it.v3g > Math.max(it.v1t, it.v2t, it.v3t, it.v1g, it.v2g)) {
      ctx.fillStyle = '#00FFFF';
      ctx.beginPath(); ctx.arc(x, Y(2), 2.5, 0, Math.PI * 2); ctx.fill();
    }
  });
  // Value labels on the right value axis: V3T + 52WH_V3T (magenta bg),
  // V3G + 52WH_V3G (cyan bg), black bold text. Same rules as Layer 1:
  // bg = line color, sorted by value (larger on top), never overlap.
  const last = show[n - 1];
  const fi = startIdx + n - 1;
  const vlabels = [
    { v: last.v3t, bg: '#FF00FF' },
    { v: last.v3g, bg: '#00FFFF' },
    { v: hhv260t[fi], bg: '#FF00FF' },
    { v: hhv260g[fi], bg: '#00FFFF' },
  ].filter(l => l.v != null);
  const LH = 15;
  const GAP = LH + 2;
  const ys = vlabels.map(l => Y(l.v)).sort((a, b) => a - b);
  for (let i = 1; i < ys.length; i++) {
    if (ys[i] - ys[i - 1] < GAP) ys[i] = ys[i - 1] + GAP;
  }
  if (ys.length && ys[ys.length - 1] + LH / 2 > T + plotH) {
    const shift = ys[ys.length - 1] + LH / 2 - (T + plotH);
    for (let i = 0; i < ys.length; i++) ys[i] -= shift;
  }
  if (ys.length && ys[0] - LH / 2 < T) {
    const shift = T - (ys[0] - LH / 2);
    for (let i = 0; i < ys.length; i++) ys[i] += shift;
  }
  const sorted = vlabels.slice().sort((a, b) => b.v - a.v);
  ctx.font = 'bold 10px Arial';
  ctx.textBaseline = 'middle';
  sorted.forEach((l, i) => {
    const y = ys[i];
    const txt = String(l.v);
    const w = Math.min(R - 4, ctx.measureText(txt).width + 8);
    const x0 = cssW - R + 2;
    ctx.fillStyle = l.bg;
    ctx.fillRect(x0, y - LH / 2, w, LH);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.fillText(txt, x0 + w / 2, y + 0.5);
  });
}
function loadTMA() {
  fetch('tma_counts.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được tma_counts.json');
    return r.json();
  }).then(data => {
    const show = data.items.filter(it => it.date >= data.from);
    // Layer 4: % up-phase vs % down-phase (same shape as Layers 2/3).
    const pct4 = {
      items: show.map(it => ({ date: it.date, pct_above: it.pct_vt, pct_below: it.pct_vg })),
    };
    pctLayers['tma4chart'] = pct4;
    const l = data.latest;
    document.getElementById('tma4info').innerHTML =
      '%VT: <span style="color:#00FF22">' + l.pct_vt.toFixed(2) + '%</span>' +
      ' &nbsp;|&nbsp; %VG: <span style="color:#C40000">' + l.pct_vg.toFixed(2) + '%</span>';
    drawPctChart(document.getElementById('tma4chart'), pct4);
    // Layer 5: V3T / V3G counts.
    tma5Data = data;
    const fmtChg = c => '(' + (c > 0 ? '+' : '') + c + ')';
    document.getElementById('tma5info').innerHTML =
      'V3T: <span style="color:#FF00FF">' + l.v3t + fmtChg(l.v3t_chg) + '</span>' +
      ' &nbsp;|&nbsp; 52WH_V3T: <span style="color:#FF00FF">' + l.hhv260_v3t + '</span>' +
      ' &nbsp;|&nbsp; V3G: <span style="color:#00FFFF">' + l.v3g + fmtChg(l.v3g_chg) + '</span>' +
      ' &nbsp;|&nbsp; 52WH_V3G: <span style="color:#00FFFF">' + l.hhv260_v3g + '</span>';
    drawTMA5Chart(document.getElementById('tma5chart'), data);
  }).catch(e => {
    document.getElementById('tma4info').textContent = 'Chưa có dữ liệu: ' + e.message;
    document.getElementById('tma5info').textContent = 'Chưa có dữ liệu: ' + e.message;
  });
}
loadTMA();

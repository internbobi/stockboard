<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTCKVN</title>
<style>
  * { box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; }
  h1 { text-align: center; font-size: 28px; margin: 8px 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; max-width: 1100px; margin: 0 auto; }
  .cell { aspect-ratio: 4 / 3; border: 1px solid #fff; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; text-align: center; }
  .cell.up { background: #00FF22; color: #000; }
  .cell.down { background: #C40000; color: #fff; }
  .cell.flat { background: #FFCC00; color: #000; }
  .sym { font-weight: bold; font-size: 13px; }
  .close { font-size: 11px; }
  .chg { font-size: 11px; }
  .val { font-size: 11px; }
  .foot { text-align: center; color: #888; font-size: 12px; margin-top: 20px; line-height: 1.5; }
  #countdown { position: fixed; right: 14px; bottom: 12px; background: rgba(255,255,255,0.14); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; z-index: 10; }
  #status { text-align: center; color: #bbb; }
</style>
</head>
<body>
<h1 id="title">TTCKVN</h1>
<div class="grid" id="grid"></div>
<p id="status">Đang tải dữ liệu…</p>
<p class="foot">Đây chỉ là bảng hiển thị dữ liệu, không phải khuyến nghị đầu tư.</p>
<div id="countdown"></div>
<script>
const EX_MAP = { HOSE: 'HSX', HSX: 'HSX', HNX: 'HNX', UPCOM: 'UPCOM' };
function fmtDate(iso) {
  const p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function fmtChange(change, pct) {
  const sign = change > 0 ? '+' : (change < 0 ? '' : '');
  return sign + change.toFixed(2) + ' (' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%)';
}
function renderBoard(data) {
  document.getElementById('title').textContent = 'TTCKVN Ngày ' + fmtDate(data.date);
  document.getElementById('status').textContent = '';
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  data.items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'cell ' + (it.change > 0 ? 'up' : (it.change < 0 ? 'down' : 'flat'));
    const ex = EX_MAP[it.exchange] || it.exchange || '';
    d.innerHTML = '<div class="sym">' + it.symbol + ' (' + ex + ')</div>'
      + '<div class="close">' + it.close.toFixed(2) + '</div>'
      + '<div class="chg">' + fmtChange(it.change, it.pct) + '</div>'
      + '<div class="val">' + it.value_billion.toFixed(2) + ' tỷ</div>';
    grid.appendChild(d);
  });
}
function loadData() {
  fetch('data.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được data.json');
    return r.json();
  }).then(renderBoard).catch(e => {
    document.getElementById('status').textContent = 'Chưa có dữ liệu: ' + e.message;
  });
}
loadData();
setInterval(loadData, 30000);
function nextRefreshDate(now) {
  const day = now.getDay();
  if (day === 0 || day === 6) return null;
  const mins = now.getHours() * 60 + now.getMinutes();
  const start = 8 * 60 + 45, end = 15 * 60;
  if (mins < start) {
    const d = new Date(now); d.setHours(8, 45, 0, 0); return d;
  }
  if (mins >= end) return null;
  const next = new Date(now);
  next.setSeconds(0, 0);
  next.setMinutes(next.getMinutes() + (5 - (next.getMinutes() % 5)));
  if (next.getHours() * 60 + next.getMinutes() > end) return null;
  return next;
}
function tickCountdown() {
  const el = document.getElementById('countdown');
  const target = nextRefreshDate(new Date());
  if (!target) {
    el.textContent = 'Đã hết phiên giao dịch — cập nhật tiếp theo lúc 8:45';
    return;
  }
  const diff = Math.max(0, target - new Date());
  const x = Math.floor(diff / 60000);
  const y = Math.floor((diff % 60000) / 1000);
  el.textContent = 'Cập nhật tiếp theo trong ' + x + ' phút ' + y + ' giây';
}
tickCountdown();
setInterval(tickCountdown, 1000);
</script>
</body>
</html>

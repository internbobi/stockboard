<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTCKVN</title>
<style>
  * { box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; display: flex; }
  h1 { text-align: center; font-size: 2.6cqw; margin: 0.8cqw 0 1.4cqw; line-height: 1.2; }
  #countdown { position: fixed; right: 14px; bottom: 12px; background: rgba(255,255,255,0.14); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; z-index: 10; }
  #counters { position: fixed; left: 14px; bottom: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; }
  /* Hide FeedPulse's credit + owner links under the badges (both widgets
     render inline DOM, not iframes, so CSS can hide them; the counts
     are fetched independently and keep working). */
  #visitorCounter [data-ltf-online] > a,
  #visitorCounter [data-ltf-online] > div:last-of-type { display: none !important; }
  #hitCounter [data-ltf-hits] > a { display: none !important; }
  /* Both badges exactly the same size: 170 x 23 px, content centered. */
  #visitorCounter [data-ltf-online] > div:first-of-type,
  #hitCounter [data-ltf-hits] > div:first-of-type {
    width: 170px !important; height: 23px !important;
    box-sizing: border-box !important; padding: 5px 11px !important;
    justify-content: center !important; gap: 4px !important;
  }
  /* Shrink the hit counter's digits/label to the visitor badge's size. */
  #hitCounter [data-ltf-hits] [data-count] { font-size: 13px !important; }
  #hitCounter [data-ltf-hits] > div:first-of-type > span:last-child { font-size: 9px !important; }
  .market { width: 33.33%; min-height: 100vh; container-type: inline-size; padding: 1.5cqw 1.2cqw; }
  /* Chart heights in vh (Dat 2026-11-20): the old fixed 320px/120px made
     Block 1 ~997px tall, which fits a clean 1920x1080 viewport (998px)
     with only ~30px to spare — any display scaling (Windows 125% is
     common), bookmarks bar or extra browser chrome tipped it over the
     edge and cut off Layer 5. vh heights auto-scale to the actual
     viewport: Layer 1 30vh + 4 x 10.5vh = 72vh of canvas, plus ~20vh of
     title/info/padding = ~92vh, so all 5 layers fit on any 16:9 screen.
     On a taller screen (2.4K) the charts grow and use the extra space.
     The draw code sizes canvases from clientHeight, so it follows the
     CSS height on the next redraw (30s refresh or resize handler). */
  .market canvas { width: 100%; height: 30vh; display: block; background: #000; }
  .vninfo { text-align: center; color: #bbb; font-size: 1.6cqw; margin: 0.5cqw 0 1cqw; line-height: 1.5; }
  /* % layers (Tang 2, 3, 4, 5) all share the same height, so the panel still
     fits Layers 4 & 5 below. Layer 1 stays taller as the main chart.
     Heights are vh (see above) so the panel auto-scales to the viewport.
     NOTE: the selector must beat ".market canvas" (0,1,1), so it is written
     as ".market canvas.pct-chart" (0,2,1) — a bare ".pct-chart" (0,1,0)
     loses and the % layers silently stay 30vh (caught 2026-11-11, when
     they were 320px). */
  .market canvas.pct-chart { height: 10.5vh; }
  /* Block 3 (Setup 1, Dat 2026-11-19): all symbols, one small cell each.
     Panel is exactly viewport height and scrolls internally, so the long
     1518-symbol list never stretches Block 1 / Block 2. */
  .setup { width: 33.33%; height: 100vh; container-type: inline-size; padding: 1.5cqw 1.2cqw; display: flex; flex-direction: column; }
  .setup-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 0.5cqw; overflow-y: auto; flex: 1; padding-bottom: 36px; align-content: start; grid-auto-rows: min-content; }
  .setup-cell { border: 1px solid #fff; border-radius: 4px; background: #BEBEBE; color: #000; font-weight: bold; font-size: 1.9cqw; text-align: center; height: 2.3vh; padding: 0 0.2cqw; display: flex; align-items: center; justify-content: center; line-height: 1.15; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .setup-cell.selected { outline: 2px solid #fff; outline-offset: -2px; }
  .setup-cell .sym-wrap { position: relative; }
  .setup-cell .star { position: absolute; right: 100%; margin-right: 2px; top: 50%; transform: translateY(-50%); font-size: 1.9cqw; line-height: 1; }
  /* All / 10B toggle (Dat 2026-11-19): switches the same panel between the
     full Top 30% ("All") and the 10B subset (same cells, colors, stars —
     only fewer symbols). */
  .setup-toggle { display: flex; gap: 6px; justify-content: center; margin: 2px 0 6px; }
  .setup-toggle button { background: #333; color: #fff; border: 1px solid #666; border-radius: 6px; font-size: 12px; font-weight: bold; padding: 3px 12px; cursor: pointer; }
  .setup-toggle button.on { background: #fff; color: #000; border-color: #fff; }
  /* Block 3 (new, Dat 2026-11-20): per-symbol chart for the symbol clicked
     in Block 2 (Setup 1). Layer 1 = price bars (same frame as the VNINDEX
     chart, 30vh), Layer 2 = matched volume, Layer 3 = RSI(14). All three
     share the same 1-year time axis. Heights are vh like Block 1, so the
     panel auto-scales to the viewport and Layer 1 always matches the
     VNINDEX frame height on any screen. */
  .stock { width: 33.33%; min-height: 100vh; container-type: inline-size; padding: 1.5cqw 1.2cqw; }
  .stock canvas { width: 100%; height: 30vh; display: block; background: #000; }
  .stock canvas.stock-sub { height: 10.5vh; }
  .stockinfo { text-align: center; color: #bbb; font-size: 1.6cqw; margin: 0.5cqw 0 1cqw; line-height: 1.5; }
</style>
</head>
<body>
<div class="market">
<h1>Trạng thái TTCKVN</h1>
<div id="vninfo" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="vnchart"></canvas>
<div id="ema50info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="ema50chart" class="pct-chart"></canvas>
<div id="ema200info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="ema200chart" class="pct-chart"></canvas>
<div id="tma4info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="tma4chart" class="pct-chart"></canvas>
<div id="tma5info" class="vninfo">Đang tải dữ liệu…</div>
<canvas id="tma5chart" class="pct-chart"></canvas>
</div>
<div class="setup">
<h1 id="setupTitle">Setup 1</h1>
<div class="setup-toggle"><button id="setupBtnAll" class="on">All</button><button id="setupBtn10B">10B</button></div>
<div class="setup-grid" id="setupGrid"></div>
</div>
<div class="stock">
<h1 id="stockTitle">Chọn mã ở Block 2</h1>
<div id="stockinfo" class="stockinfo">Bấm vào một mã trong danh sách Setup 1 để xem chart.</div>
<canvas id="stockchart"></canvas>
<canvas id="stockvolchart" class="stock-sub"></canvas>
<canvas id="stockrsichart" class="stock-sub"></canvas>
<canvas id="stockscorechart" class="stock-sub"></canvas>
</div>
<div id="countdown"></div>
<div id="counters"><div id="visitorCounter"><script async src="https://feed-pulse.com/api/embed/online-visitors.js?site_id=f705a8f4-2acf-43fd-89f0-cd7d7ffd9bd6&theme=obsidian&sz=micro"></script></div><div id="hitCounter"><script async src="https://feed-pulse.com/api/embed/hit-counter.js?site_id=f705a8f4-2acf-43fd-89f0-cd7d7ffd9bd6&theme=obsidian&style=card&base=0&reset_at=0&reset_to=0&digits=7"></script></div></div>
<script>
// Disable right-click (context menu) everywhere on the page (Dat 2026-11-20).
// This is the overlay that blocks right-clicks at any point on the screen:
// it intercepts the contextmenu event (mouse right-click, Menu key,
// Shift+F10) and cancels it, so no context menu ever appears. Left-click
// still works normally (clicking symbols, toggles, etc.). A transparent
// overlay div would also block left-clicks, so it is NOT used here.
document.addEventListener('contextmenu', e => e.preventDefault());
function fmtDate(iso) {
  const p = iso.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}
function fmtPricePct(close, pct) {
  return close.toFixed(2) + ' (' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%)';
}
function renderBoard(data) {
  // Block 1 (the TTCKVN board) was removed 2026-11-20 (Dat) — the page no
  // longer renders the board, but data.json is still fetched for the date
  // (Setup 1 title) and the cron still updates it. Keep this as a date
  // setter only; the board grid is gone.
  document.getElementById('setupTitle').textContent = 'Setup 1 - Ngày ' + fmtDate(data.date);
}
function loadData() {
  fetch('data.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được data.json');
    return r.json();
  }).then(renderBoard).catch(e => {
    document.getElementById('setupTitle').textContent = 'Setup 1 (chưa có dữ liệu)';
  });
}
function refreshAll() {
  loadData();
  loadSetup();
  // Block 2 layers: re-fetch so the 5 layers update every 5 min.
  // BUG (Dat, 2026-11-12): the Block 2 JSONs were only loaded once on
  // page load, so the countdown counted down but the 5 layers never
  // changed. The typeof guards cover a script block failing to load.
  if (typeof loadVNChart === 'function') loadVNChart();
  if (typeof loadPctChart === 'function') {
    loadPctChart('pct_ema50.json', 'ema50info', 'ema50chart', 'MidStrong', 'MidWeak');
    loadPctChart('pct_ema200.json', 'ema200info', 'ema200chart', 'LongStrong', 'LongWeak');
  }
  if (typeof loadTMA === 'function') loadTMA();
}
loadData();
setInterval(refreshAll, 30000);
// ---- Block 3 (Setup 1): Top 10/20/30 groups ----
// setup1.json: ranked list with group labels (rank order = score descending).
// Only the top 30% is shown, colored by group: Top 10% magenta (V3T color
// in Block 2), Top 20% green (up-price color in Block 1), Top 30% yellow
// (flat-price color in Block 1). Reloaded every 30s; re-rendered only when
// the list actually changes, so the panel's scroll position is not reset.
// All / 10B toggle (Dat 2026-11-19): "All" shows the full Top 30%; "10B"
// shows only the grouped symbols flagged for the 10B view. Cells, group
// colors and stars are identical in both views — 10B only shows fewer
// symbols. The toggle state survives the
// 30s reloads (renderSetup reads setupView, not the fetch).
let setupData = null;
let setupSyms = null;
let setupView = 'all'; // 'all' or '10b'
const SETUP_COLORS = {'Top 10%': '#FF00FF', 'Top 20%': '#00FF22', 'Top 30%': '#FFCC00'};
// Star colors (Dat 2026-11-19): shown left of the symbol when it is a NEW
// entrant to its group (was not in that group in the previous session).
// Top 10% yellow (flat-price color), Top 20% dark blue, Top 30% dark purple.
const STAR_COLORS = {'Top 10%': '#FFCC00', 'Top 20%': '#00008B', 'Top 30%': '#522081'};
function renderSetup() {
  if (!setupData) return;
  const all = setupData.items.filter(it => it.group);
  const shown = setupView === '10b' ? all.filter(it => it.v10b) : all;
  // Button labels carry the live counts so the filter is visible at a glance.
  document.getElementById('setupBtnAll').textContent = 'All (' + all.length + ')';
  document.getElementById('setupBtn10B').textContent = '10B (' + all.filter(it => it.v10b).length + ')';
  const key = setupView + '|' + shown.map(it => it.symbol + ':' + it.group + ':' + (it.star ? '1' : '0')).join(',');
  if (key === setupSyms) return; // unchanged — keep scroll position
  setupSyms = key;
  const grid = document.getElementById('setupGrid');
  const st = grid.scrollTop;
  grid.innerHTML = '';
  shown.forEach(it => {
    const d = document.createElement('div');
    d.className = 'setup-cell' + (it.symbol === selectedStock ? ' selected' : '');
    d.style.background = SETUP_COLORS[it.group];
    if (it.star) {
      // Star is absolutely positioned left of the symbol (inside .sym-wrap),
      // so the symbol text itself stays centered in the cell — the star
      // never pushes the text off-center.
      d.innerHTML = '<span class="sym-wrap"><span class="star" style="color:' + STAR_COLORS[it.group] + '">★</span>' + it.symbol + '</span>';
    } else {
      d.textContent = it.symbol;
    }
    // Click a symbol -> show its chart in Block 3 (new, Dat 2026-11-20).
    d.onclick = () => selectStock(it.symbol);
    grid.appendChild(d);
  });
  grid.scrollTop = st;
}
function setSetupView(v) {
  setupView = v;
  document.getElementById('setupBtnAll').classList.toggle('on', v === 'all');
  document.getElementById('setupBtn10B').classList.toggle('on', v === '10b');
  renderSetup();
}
document.getElementById('setupBtnAll').onclick = () => setSetupView('all');
document.getElementById('setupBtn10B').onclick = () => setSetupView('10b');
function loadSetup() {
  fetch('setup1.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được setup1.json');
    return r.json();
  }).then(data => {
    setupData = data;
    renderSetup();
    // Default the stock chart to the top-ranked symbol once both the
    // Setup 1 list and the OHLC data are in (fixes a race: loadStockData
    // alone cannot pick a default when setupData has not arrived yet).
    if (typeof selectDefaultStock === 'function') selectDefaultStock();
  }).catch(e => {
    document.getElementById('setupGrid').textContent = 'Chưa có dữ liệu: ' + e.message;
  });
}
loadSetup();
function nextRefreshDate(now) {
  const day = now.getDay();
  if (day === 0 || day === 6) return null;
  const mins = now.getHours() * 60 + now.getMinutes();
  const start = 8 * 60 + 45, end = 15 * 60, lunchS = 11 * 60 + 30, lunchE = 13 * 60;
  if (mins < start) {
    const d = new Date(now); d.setHours(8, 45, 0, 0); return d;
  }
  if (mins >= end) return null;
  // Lunch break 11:30-13:00 (Dat, 2026-11-12): no 5-min updates, next is 13:00.
  if (mins >= lunchS && mins < lunchE) {
    const d = new Date(now); d.setHours(13, 0, 0, 0); return d;
  }
  const next = new Date(now);
  next.setSeconds(0, 0);
  next.setMinutes(next.getMinutes() + (5 - (next.getMinutes() % 5)));
  const nm = next.getHours() * 60 + next.getMinutes();
  if (nm > end) return null;
  if (nm >= lunchS && nm < lunchE) {
    const d = new Date(now); d.setHours(13, 0, 0, 0); return d;
  }
  return next;
}
function tickCountdown() {
  const el = document.getElementById('countdown');
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  // Lunch break message (Dat, 2026-11-12).
  if (now.getDay() !== 0 && now.getDay() !== 6 && mins >= 11 * 60 + 30 && mins < 13 * 60) {
    el.textContent = 'Nghỉ trưa — cập nhật tiếp theo lúc 13:00';
    return;
  }
  const target = nextRefreshDate(now);
  if (!target) {
    el.textContent = 'Đã hết phiên giao dịch — cập nhật tiếp theo lúc 8:45';
    return;
  }
  const diff = Math.max(0, target - new Date());
  const x = Math.floor(diff / 60000);
  const y = Math.floor((diff % 60000) / 1000);
  el.textContent = 'Cập nhật tiếp theo trong ' + x + ' phút ' + y + ' giây';
}
tickCountdown();
setInterval(tickCountdown, 1000);
</script>
<script>
// ---- Feature 2: VNINDEX chart (last 1 year, daily bars) ----
let vnData = null;
const VN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Empty space after the last session (Dat, 2026-11-12): ~15 bars of breathing
// room on the right of every Block 2 chart, so the last bar is not jammed
// against the right edge and the value labels sit clear of the data.
const PAD_BARS = 15;
function fmtNum(x, dec) {
  return x.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}
function drawVNChart() {
  if (!vnData) return;
  const cv = document.getElementById('vnchart');
  const cssW = cv.clientWidth, cssH = cv.clientHeight;
  if (!cssW || !cssH) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssW, cssH);
  const items = vnData.items, n = items.length;
  const L = 6, R = 62, T = 8, B = 26;
  const plotW = cssW - L - R, plotH = cssH - T - B;
  let mn = Infinity, mx = -Infinity;
  items.forEach(it => {
    mn = Math.min(mn, it.low, it.ma10, it.ma50, it.ma150, it.ma200);
    mx = Math.max(mx, it.high, it.ma10, it.ma50, it.ma150, it.ma200);
  });
  const pad = (mx - mn) * 0.03;
  mn -= pad; mx += pad;
  const X = i => L + (i + 0.5) * plotW / (n + PAD_BARS);
  const Y = p => T + (mx - p) / (mx - mn) * plotH;
  const range = mx - mn;
  const step = range > 400 ? 100 : range > 200 ? 50 : range > 100 ? 25 : 10;
  ctx.font = '11px Arial';
  ctx.textBaseline = 'middle';
  for (let p = Math.ceil(mn / step) * step; p <= mx; p += step) {
    const y = Y(p);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(cssW - R, y); ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'left';
    ctx.fillText(fmtNum(p, 0), cssW - R + 6, y);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  // Month labels: same Nov/Dec overlap fix as the stock chart (Dat 2026-11-20)
  // — skip the first partial month when it has < 10 bars, and skip any label
  // that would overlap the previously drawn one.
  let prevLx = null, prevW = 0;
  for (let i = 0; i < n; i++) {
    const d = items[i].date;
    const m = parseInt(d.slice(5, 7), 10);
    const prevM = i > 0 ? parseInt(items[i - 1].date.slice(5, 7), 10) : null;
    if (m !== prevM) {
      if (i === 0) {
        let cnt = 0;
        for (let j = 0; j < n && items[j].date.slice(0, 7) === d.slice(0, 7); j++) cnt++;
        if (cnt < 10) continue;
      }
      const x = X(i);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + plotH); ctx.stroke();
      ctx.fillStyle = '#aaa';
      const label = (m === 1) ? d.slice(0, 4) : VN_MONTHS[m - 1];
      const lx = Math.max(14, Math.min(cssW - R - 14, x));
      const w = ctx.measureText(label).width;
      if (prevLx !== null && lx - prevLx < (prevW + w) / 2 + 4) continue;
      ctx.fillText(label, lx, T + plotH + 6);
      prevLx = lx; prevW = w;
    }
  }
  // SMA lines, SMA only on this chart (Dat, 2026-11-11).
  // Colors: MA50 green, MA150 yellow, MA200 red.
  const mas = [['ma200', '#C40000'], ['ma150', '#FFCC00'], ['ma50', '#00FF22']];
  mas.forEach(([key, col]) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let started = false;
    items.forEach((it, i) => {
      const v = it[key];
      if (v == null) return;
      if (!started) { ctx.moveTo(X(i), Y(v)); started = true; }
      else ctx.lineTo(X(i), Y(v));
    });
    ctx.stroke();
  });
  // MA10: color changes along the line, applied to SMA10
  // (C > SMA10: pale green #98FB98, C < SMA10: red #FF0000, C == SMA10: yellow #FFFF00)
  ctx.lineWidth = 1.5;
  for (let i = 1; i < n; i++) {
    const a = items[i - 1], b = items[i];
    if (a.ma10 == null || b.ma10 == null) continue;
    ctx.strokeStyle = a.ma10_color;
    ctx.beginPath();
    ctx.moveTo(X(i - 1), Y(a.ma10));
    ctx.lineTo(X(i), Y(b.ma10));
    ctx.stroke();
  }
  const bw = Math.max(1, plotW / (n + PAD_BARS) * 0.6);
  items.forEach((it, i) => {
    const x = X(i);
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, Y(it.high));
    ctx.lineTo(x, Y(it.low));
    ctx.moveTo(x - bw / 2, Y(it.close));
    ctx.lineTo(x + bw / 2, Y(it.close));
    ctx.stroke();
  });
  // Value labels on the right price axis: VN Index (white bg) + 4 MA values
  // (bg = line color), black bold text. May overlap the axis tick marks.
  const last = items[n - 1];
  const vlabels = [
    { v: last.close, bg: '#FFFFFF' },
    { v: last.ma10, bg: last.ma10_color },
    { v: last.ma50, bg: '#00FF22' },
    { v: last.ma150, bg: '#FFCC00' },
    { v: last.ma200, bg: '#C40000' },
  ].filter(l => l.v != null);
  const LH = 15;
  const GAP = LH + 2; // 2px gap: labels never touch or overlap, all stay visible;
  // sorted by value top-to-bottom (larger value on top), pushed down only as needed
  const ys = vlabels.map(l => Y(l.v)).sort((a, b) => a - b);
  for (let i = 1; i < ys.length; i++) {
    if (ys[i] - ys[i - 1] < GAP) ys[i] = ys[i - 1] + GAP;
  }
  if (ys.length && ys[ys.length - 1] + LH / 2 > T + plotH) {
    const shift = ys[ys.length - 1] + LH / 2 - (T + plotH);
    for (let i = 0; i < ys.length; i++) ys[i] -= shift;
  }
  if (ys.length && ys[0] - LH / 2 < T) {
    const shift = T - (ys[0] - LH / 2);
    for (let i = 0; i < ys.length; i++) ys[i] += shift;
  }
  const sorted = vlabels.slice().sort((a, b) => b.v - a.v);
  ctx.font = 'bold 10px Arial';
  ctx.textBaseline = 'middle';
  sorted.forEach((l, i) => {
    const y = ys[i];
    const txt = fmtNum(l.v, 2);
    const w = Math.min(R - 4, ctx.measureText(txt).width + 8);
    const x0 = cssW - R + 2;
    ctx.fillStyle = l.bg;
    ctx.fillRect(x0, y - LH / 2, w, LH);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.fillText(txt, x0 + w / 2, y + 0.5);
  });
}
function loadVNChart() {
  fetch('vnindex.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được vnindex.json');
    return r.json();
  }).then(data => {
    vnData = data;
    const l = data.latest;
    document.getElementById('vninfo').innerHTML =
      'VNINDEX ' + l.date.split('-').reverse().join('/') +
      ' &nbsp;|&nbsp; Open ' + fmtNum(l.open, 2) +
      ', High ' + fmtNum(l.high, 2) +
      ', Low ' + fmtNum(l.low, 2) +
      ', Close ' + fmtNum(l.close, 2) +

    ctx.lineTo(x + 4, y + 3);

    ctx.moveTo(x, y + 4);
    ctx.lineTo(x - 4, y - 3);
    ctx.lineTo(x + 4, y - 3);

  ctx.closePath();
  ctx.fill();
}

<script>
// ---- Block 3 (new, Dat 2026-11-20): per-symbol chart ----
// Click a symbol in Block 2 (Setup 1) -> its 1-year chart here.
// Layer 1: price bars (same frame + color rules as the VNINDEX chart,
// 30vh). Layer 2: daily matched volume. Layer 3: RSI(14), white line.
// Layer 4: Score line (Dat 2026-11-21), white thin line + group dots.
// All four share the same 1-year time axis (same X mapping, same bars).

// symbol was ranked but below the top 30% (group null) gets cyan.
const SCORE_DOT_COLORS = { 'Top 10%': '#FF00FF', 'Top 20%': '#00FF22', 'Top 30%': '#FFCC00' };
const SCORE_DOT_BELOW = '#00FFFF'; // ranked but below top 30%
const STOCK_BARS = 250; // ~1 year of trading days, same window as VNINDEX
function stockBarColor(close, prev) {
  // Same AFL rules as the VNINDEX bars (fetch_vnindex.py bar_color).
  if (prev == null || close === prev) return '#FFCC00';
  if (close > prev) return (close / prev - 1) >= 0.05 ? '#FF00FF' : '#00FF22';
  return (prev / close - 1) >= 0.05 ? '#00FFFF' : '#C40000';
}
function computeRSI(closes, period) {
  // Wilder's RSI: first value = simple avg gain/loss over `period`,
  // then smoothed (prev*13 + current)/14. Returns array same length as
  // closes, with null for the first `period` bars (no RSI yet).
  const n = closes.length;
  const rsi = new Array(n).fill(null);
  if (n <= period) return rsi;
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    const ch = closes[i] - closes[i - 1];
    if (ch > 0) gain += ch; else loss -= ch;
  }
  let avgG = gain / period, avgL = loss / period;
  rsi[period] = avgL === 0 ? 100 : (avgG === 0 ? 0 : 100 - 100 / (1 + avgG / avgL));
  for (let i = period + 1; i < n; i++) {
    const ch = closes[i] - closes[i - 1];
    const g = ch > 0 ? ch : 0, l = ch < 0 ? -ch : 0;
    avgG = (avgG * (period - 1) + g) / period;
    avgL = (avgL * (period - 1) + l) / period;
    rsi[i] = avgL === 0 ? 100 : (avgG === 0 ? 0 : 100 - 100 / (1 + avgG / avgL));
  }

}
function stockDisplayBars(h) {

  const rsi = computeRSI(h.closes, 14);

function drawStockChart() {
  if (!stockOHLC || !selectedStock) return;
  const h = stockOHLC[selectedStock];
  if (!h) return;
  const bars = stockDisplayBars(h);
  const n = bars.length;
  if (!n) return;
  const L = 6, R = 62, T = 8, B = 26;
  const X = (cv, i) => L + (i + 0.5) * (cv.clientWidth - L - R) / (n + PAD_BARS);
  // Shared month labels (drawn on price + RSI canvases).
  // FIX (Dat 2026-11-20): Nov/Dec 2025 overlapped because the 1-year window
  // starts mid-November (250 bars back from today), so November has only
  // ~2 bars in the window and its label sits a few pixels from December's.
  // Two guards: (1) skip the label for the first (partial) month when it
  // has fewer than 10 bars in the window; (2) skip any label that would
  // overlap the previously drawn one (centered labels need half-widths
  // plus a gap apart).
  function monthLabels(ctx, cv, plotH) {
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    let prevLx = null, prevW = 0;
    for (let i = 0; i < n; i++) {
      const d = bars[i].date;
      const m = parseInt(d.slice(5, 7), 10);
      const prevM = i > 0 ? parseInt(bars[i - 1].date.slice(5, 7), 10) : null;
      if (m !== prevM) {
        // Guard 1: first (partial) month with < 10 bars — skip its label.
        if (i === 0) {
          let cnt = 0;
          for (let j = 0; j < n && bars[j].date.slice(0, 7) === d.slice(0, 7); j++) cnt++;
          if (cnt < 10) continue;
        }
        const x = X(cv, i);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + plotH); ctx.stroke();
        ctx.fillStyle = '#aaa';
        const label = (m === 1) ? d.slice(0, 4) : VN_MONTHS[m - 1];
        const lx = Math.max(14, Math.min(cv.clientWidth - R - 14, x));
        const w = ctx.measureText(label).width;
        // Guard 2: skip if it would overlap the previously drawn label.
        if (prevLx !== null && lx - prevLx < (prevW + w) / 2 + 4) continue;
        ctx.fillText(label, lx, T + plotH + 6);
        prevLx = lx; prevW = w;
      }
    }
  }
  function setupCanvas(id) {
    const cv = document.getElementById(id);
    const cssW = cv.clientWidth, cssH = cv.clientHeight;
    if (!cssW || !cssH) return null;
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cssW, cssH);
    return { cv, ctx, cssW, cssH };
  }
  // ---- Layer 1: price bars (same frame as VNINDEX, 30vh) ----
  const p = setupCanvas('stockchart');
  if (p) {
    const plotW = p.cssW - L - R, plotH = p.cssH - T - B;
    let mn = Infinity, mx = -Infinity;
    bars.forEach(b => { mn = Math.min(mn, b.low); mx = Math.max(mx, b.high); });
    const pad = (mx - mn) * 0.03; mn -= pad; mx += pad;
    const Y = v => T + (mx - v) / (mx - mn) * plotH;
    const range = mx - mn;
    const step = range > 400 ? 100 : range > 200 ? 50 : range > 100 ? 25 : range > 20 ? 10 : range > 5 ? 2 : 1;
    p.ctx.font = '11px Arial';
    p.ctx.textBaseline = 'middle';
    for (let v = Math.ceil(mn / step) * step; v <= mx; v += step) {
      const y = Y(v);
      p.ctx.strokeStyle = '#222';
      p.ctx.lineWidth = 1;
      p.ctx.beginPath(); p.ctx.moveTo(L, y); p.ctx.lineTo(p.cssW - R, y); p.ctx.stroke();
      p.ctx.fillStyle = '#aaa';
      p.ctx.textAlign = 'left';
      p.ctx.fillText(fmtNum(v, 0), p.cssW - R + 6, y);
    }
    monthLabels(p.ctx, p.cv, plotH);
    const bw = Math.max(1, plotW / (n + PAD_BARS) * 0.6);
    bars.forEach((b, i) => {
      const x = X(p.cv, i);
      p.ctx.strokeStyle = b.color;
      p.ctx.lineWidth = 1.5;
      p.ctx.beginPath();
      p.ctx.moveTo(x, Y(b.high));
      p.ctx.lineTo(x, Y(b.low));
      p.ctx.moveTo(x - bw / 2, Y(b.close));
      p.ctx.lineTo(x + bw / 2, Y(b.close));
      p.ctx.stroke();
    });
    // Latest close label (white bg, black text) on the right axis.
    const last = bars[n - 1];
    const ly = Y(last.close);
    p.ctx.font = 'bold 10px Arial';
    p.ctx.textBaseline = 'middle';
    const txt = fmtNum(last.close, 2);
    const w = Math.min(R - 4, p.ctx.measureText(txt).width + 8);
    p.ctx.fillStyle = '#FFFFFF';
    p.ctx.fillRect(p.cssW - R + 2, ly - 7.5, w, 15);
    p.ctx.fillStyle = '#000';
    p.ctx.textAlign = 'center';
    p.ctx.fillText(txt, p.cssW - R + 2 + w / 2, ly + 0.5);
  }
  // ---- Layer 2: daily matched volume (same time axis) ----
  const v = setupCanvas('stockvolchart');
  if (v) {
    const plotW = v.cssW - L - R, plotH = v.cssH - T - B;
    let mx = 0;
    bars.forEach(b => { mx = Math.max(mx, b.volume || 0); });
    if (mx <= 0) mx = 1;
    const Y = val => T + (1 - val / mx) * plotH;
    // Time axis (Dat 2026-11-20): month labels + grid lines, same as the
    // price and RSI layers, so all three layers share the time axis.
    monthLabels(v.ctx, v.cv, plotH);
    const bw = Math.max(1, plotW / (n + PAD_BARS) * 0.7);
    bars.forEach((b, i) => {
      const x = X(v.cv, i);
      // Volume bars follow the price direction (same colors as the bars).
      v.ctx.fillStyle = b.color;
      const y0 = Y(b.volume || 0);
      v.ctx.fillRect(x - bw / 2, y0, bw, T + plotH - y0);
    });
    // Max-volume label on the right axis.
    v.ctx.font = '11px Arial';
    v.ctx.textBaseline = 'middle';
    v.ctx.fillStyle = '#aaa';
    v.ctx.textAlign = 'left';
    v.ctx.fillText(fmtNum(mx, 0), v.cssW - R + 6, T + 5);
  }
  // ---- Layer 3: RSI(14), white line, 0-100 ----
  const r = setupCanvas('stockrsichart');
  if (r) {
    const plotW = r.cssW - L - R, plotH = r.cssH - T - B;
    const Y = val => T + (1 - val / 100) * plotH;
    // 30 / 70 reference lines (dashed grey).
    r.ctx.strokeStyle = '#444';
    r.ctx.lineWidth = 1;
    r.ctx.setLineDash([4, 4]);
    [30, 70].forEach(lv => {
      const y = Y(lv);
      r.ctx.beginPath(); r.ctx.moveTo(L, y); r.ctx.lineTo(r.cssW - R, y); r.ctx.stroke();
    });
    r.ctx.setLineDash([]);
    // Axis labels 0 / 30 / 50 / 70 / 100.
    r.ctx.font = '11px Arial';
    r.ctx.textBaseline = 'middle';
    r.ctx.fillStyle = '#aaa';
    r.ctx.textAlign = 'left';
    [0, 30, 50, 70, 100].forEach(lv => {
      r.ctx.fillText(String(lv), r.cssW - R + 6, Y(lv));
    });
    monthLabels(r.ctx, r.cv, plotH);
    // RSI line (white).
    r.ctx.strokeStyle = '#FFFFFF';
    r.ctx.lineWidth = 1.5;
    r.ctx.beginPath();
    let started = false;
    bars.forEach((b, i) => {
      if (b.rsi == null) return;
      if (!started) { r.ctx.moveTo(X(r.cv, i), Y(b.rsi)); started = true; }
      else r.ctx.lineTo(X(r.cv, i), Y(b.rsi));
    });
    r.ctx.stroke();
    // Latest RSI label (white bg, black text).
    const last = bars[n - 1];
    if (last.rsi != null) {
      const ly = Y(last.rsi);
      r.ctx.font = 'bold 10px Arial';
      r.ctx.textBaseline = 'middle';
      const txt = last.rsi.toFixed(1);
      const w = Math.min(R - 4, r.ctx.measureText(txt).width + 8);
      r.ctx.fillStyle = '#FFFFFF';
      r.ctx.fillRect(r.cssW - R + 2, ly - 7.5, w, 15);
      r.ctx.fillStyle = '#000';
      r.ctx.textAlign = 'center';
      r.ctx.fillText(txt, r.cssW - R + 2 + w / 2, ly + 0.5);
    }
  }
  // ---- Layer 4: Score line (Dat 2026-11-21) ----
  // (radius 1.2, same as the Block 1 Layer 2 dots) colored by that day's
  // group: Top 10% magenta, Top 20% green, Top 30% yellow, below the top
  // 30% cyan. Same 1-year time axis as Layers 1-3 (last 250 bars). The
  // latest Score is the right-axis label. Days the symbol was not ranked
  // have no point; the line bridges the gap (same as the RSI warm-up).
  const d = setupCanvas('stockscorechart');
  const dh = scoreHistory ? scoreHistory[selectedStock] : null;
  if (d && dh && dh.dates && dh.dates.length) {
    const plotW = d.cssW - L - R, plotH = d.cssH - T - B;
    const byDate = {};
    dh.dates.forEach((dt, k) => { byDate[dt] = { score: dh.score[k], group: dh.group[k] }; });
    const pts = [];
    let mn = Infinity, mx = -Infinity;
    bars.forEach((b, i) => {
      const e = byDate[b.date];
      if (!e) return;
      pts.push({ i, score: e.score, group: e.group });
      mn = Math.min(mn, e.score);
      mx = Math.max(mx, e.score);
    });
    if (pts.length) {
      if (mx - mn < 1) { mx += 1; mn -= 1; }
      const pad = (mx - mn) * 0.05; mn -= pad; mx += pad;
      const Y = v => T + (mx - v) / (mx - mn) * plotH;
      // Faint horizontal gridlines at round values (reference only).
      const range = mx - mn;
      const step = range > 200 ? 50 : range > 100 ? 25 : range > 50 ? 10 : 5;
      d.ctx.strokeStyle = '#222';
      d.ctx.lineWidth = 1;
      for (let v = Math.ceil(mn / step) * step; v <= mx; v += step) {
        const y = Y(v);
        d.ctx.beginPath(); d.ctx.moveTo(L, y); d.ctx.lineTo(d.cssW - R, y); d.ctx.stroke();
      }
      monthLabels(d.ctx, d.cv, plotH);
      // White thin line through the ranked days.
      d.ctx.strokeStyle = '#FFFFFF';
      d.ctx.lineWidth = 1;
      d.ctx.beginPath();
      let started = false;
      pts.forEach(pt => {
        if (!started) { d.ctx.moveTo(X(d.cv, pt.i), Y(pt.score)); started = true; }
        else d.ctx.lineTo(X(d.cv, pt.i), Y(pt.score));
      });
      d.ctx.stroke();
      // Dots, radius 1.2 (same as Block 1 Layer 2), colored by group.
      pts.forEach(pt => {
        d.ctx.fillStyle = SCORE_DOT_COLORS[pt.group] || SCORE_DOT_BELOW;
        d.ctx.beginPath();
        d.ctx.arc(X(d.cv, pt.i), Y(pt.score), 1.2, 0, Math.PI * 2);
        d.ctx.fill();
      });
      // Latest Score label (white bg, black text) on the right axis.
      const last = pts[pts.length - 1];
      const ly = Y(last.score);
      d.ctx.font = 'bold 10px Arial';
      d.ctx.textBaseline = 'middle';
      const txt = String(last.score);
      const w = Math.min(R - 4, d.ctx.measureText(txt).width + 8);
      d.ctx.fillStyle = '#FFFFFF';
      d.ctx.fillRect(d.cssW - R + 2, ly - 7.5, w, 15);
      d.ctx.fillStyle = '#000';
      d.ctx.textAlign = 'center';
      d.ctx.fillText(txt, d.cssW - R + 2 + w / 2, ly + 0.5);
    }
  }
  // Info line: symbol + latest OHLC + change.
  const last = bars[n - 1];
  const prev = n > 1 ? bars[n - 2] : null;
  const chg = prev ? (last.close / prev.close - 1) * 100 : 0;
  const dstr = last.date.split('-').reverse().join('/');
  document.getElementById('stockinfo').textContent =
    selectedStock + ' ' + dstr +
    ' | O ' + fmtNum(last.open, 2) + ', H ' + fmtNum(last.high, 2) +
    ', L ' + fmtNum(last.low, 2) + ', C ' + fmtNum(last.close, 2) +
    ' (' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%)' +
    ' | Vol ' + fmtNum(last.volume, 0) +
    (last.rsi != null ? ' | RSI(14) ' + last.rsi.toFixed(1) : '');
}
function selectStock(sym) {
  selectedStock = sym;
  document.getElementById('stockTitle').textContent = sym;
  if (stockOHLC) drawStockChart();
  if (typeof renderSetup === 'function') renderSetup();
}
function selectDefaultStock() {
  // Show the top-ranked symbol by default once both the Setup 1 list and
  // the OHLC data are loaded. Never overrides a symbol the user clicked.
  if (selectedStock) return;
  if (!stockOHLC || !setupData || !setupData.items || !setupData.items.length) return;
  const top = setupData.items.filter(it => it.group)
    .sort((a, b) => a.rank - b.rank)[0];
  if (top && stockOHLC[top.symbol]) selectStock(top.symbol);
}
function loadStockData() {
  fetch('stock_ohlc.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được stock_ohlc.json');
    return r.json();
  }).then(data => {
    stockOHLC = data;
    selectDefaultStock();
    if (selectedStock) drawStockChart();
  }).catch(e => {
    document.getElementById('stockinfo').textContent = 'Chưa có dữ liệu chart: ' + e.message;
  });
}
loadStockData();
// Score history (Layer 4). Loaded once on page load, like stock_ohlc.json
// (NOT in the 30s refreshAll). If it fails, Layer 4 stays blank and the
// other layers still work.
function loadScoreData() {
  fetch('score_history.json?t=' + Date.now()).then(r => {
    if (!r.ok) throw new Error('Không tải được score_history.json');
    return r.json();
  }).then(data => {
    scoreHistory = data;
    if (selectedStock) drawStockChart();
  }).catch(e => {
    console.warn('Score history not loaded: ' + e.message);
  });
}
loadScoreData();
</script>
